version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=dev-secret-change-in-prod
      - FERNET_KEY=${FERNET_KEY}
      - DB_PATH=/app/app_data/nutrition_insights_app.db
    volumes:
      - ./app/backend/app_data:/app/app_data

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
