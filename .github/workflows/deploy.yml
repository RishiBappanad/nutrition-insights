name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

concurrency: deploy-group

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: trackstack-501915
  REGION: us-east1
  SERVICE: trackstack-nutrition
  IMAGE: us-east1-docker.pkg.dev/trackstack-501915/cloud-run-source-deploy/trackstack-nutrition:latest
  # Gateway cutover (2026-09-12): this service is now only meant to be
  # reached through trackstack-gateway at /nutrition -- BASE_PATH/API_BASE
  # bake that prefix into the built frontend's own asset/API paths, and
  # TRACKSTACK_AUTH_URL becomes gateway-relative (same origin) instead of
  # an absolute cross-origin URL. Visiting this service's own bare Cloud
  # Run URL directly no longer serves a working frontend as a result
  # (asset tags reference /nutrition/assets/... with nothing to strip
  # that prefix outside the gateway) -- the backend/API itself is
  # completely unaffected, see nutrition-insights' own app/__init__.py.
  BASE_PATH: /nutrition/
  API_BASE: /nutrition
  TRACKSTACK_AUTH_URL: /auth

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/824912246889/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@trackstack-501915.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push image
        # Builds directly with Docker instead of `gcloud builds submit` --
        # sidesteps a Cloud Build source-upload permission wall that
        # never fully resolved even after several rounds of IAM grants.
        # Same docker build cloudbuild.yaml already runs, one fewer GCP
        # service in the path. See trackstack-auth's deploy.yml history
        # for the full diagnosis.
        run: |
          docker build \
            --build-arg "BASE_PATH=${{ env.BASE_PATH }}" \
            --build-arg "API_BASE=${{ env.API_BASE }}" \
            --build-arg "TRACKSTACK_AUTH_URL=${{ env.TRACKSTACK_AUTH_URL }}" \
            -t "${{ env.IMAGE }}" .

      - name: Push image
        run: docker push "${{ env.IMAGE }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image="${{ env.IMAGE }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"
