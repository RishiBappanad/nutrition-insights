[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackstack-calendar-client"
version = "0.1.0"
description = "Shared calendar-push client for TrackStack tracker backends (Python)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "responses>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["trackstack_calendar_client*"]
